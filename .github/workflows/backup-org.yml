# .github/workflows/backup-org.yml
#
# Runs scripts/ops/backup-org.sh on a GitHub-hosted runner and uploads the
# resulting archive as a workflow artifact. Entirely non-interactive - the
# script is the same one used locally, driven here through environment
# variables instead of prompts (see ARCHIVE_PASSWORD below).
#
# AI disclosure: the scope/account, git/source and unencrypted-archive changes
# in this file (script v4.0) were written with AI assistance (Claude,
# Anthropic), 2026-11-21.
#
# What gets backed up (workflow inputs, see `on:` below):
#   scope           org (default) | account | both. `both` runs the script once
#                   per target and produces one archive each.
#   include_git     OFF by default. Adds the bare repositories and wikis, i.e.
#                   the full git history. Without it the archive is metadata
#                   only: issues, PRs, releases, labels, Actions / security /
#                   access settings.
#   include_source  OFF by default. Adds plain source checkouts (implies git).
#   encrypt         gpg (default) | 7z | none. `none` uploads a PLAINTEXT
#                   archive; see the safeguards on that step.
#
# Required repo secrets:
#   ORG_READ_TOKEN        Fine-grained PAT or GitHub App token. The name is
#                          shared with the CODEOWNERS Sync workflow, but the
#                          scopes are NOT: that workflow only reads org
#                          members, while this one also reads repository
#                          contents, metadata, teams and team membership,
#                          security events (Dependabot / secret scanning) and
#                          Actions data. A token scoped for CODEOWNERS Sync
#                          will authenticate here and then produce a backup
#                          that is silently missing most of its sections -
#                          the script reports each gap as a warning, so check
#                          the warning count in the job summary rather than
#                          trusting a green run.
#   BACKUP_ARCHIVE_PASSWORD   Passphrase for the encrypted archive. Required
#                          whenever `encrypt` (below) is 7z or gpg; leave the
#                          secret unset only if you intend to always run this
#                          with encrypt=none.
#
# Optional repo secret:
#   ACCOUNT_READ_TOKEN    Token for the personal-account target. A fine-grained
#                          token has exactly ONE resource owner (a user or one
#                          org), so one token cannot cover scope=both unless it
#                          is a classic token. Without this secret the account
#                          target falls back to ORG_READ_TOKEN. Private
#                          repositories of the account are only included when
#                          the token belongs to that account.
#
# Optional repo/environment variables:
#   BACKUP_ORG             Organization to back up. Defaults to vortaforge
#                          (the script's own default) when unset.
#   BACKUP_ACCOUNT         Personal account to back up for scope=account/both
#                          when the `account` input is left empty.
#
# Manual-trigger only by default, same reasoning as CODEOWNERS Sync's
# maintenance pause: no unattended token use while the org is quiet. Uncomment
# the schedule block to back up automatically again. A scheduled run always
# uses the org target with encrypt=gpg, metadata only.
name: Organization Backup

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to back up (account/both need the account input or the BACKUP_ACCOUNT variable)"
        type: choice
        default: org
        options: [org, account, both]
      account:
        description: "Personal account login (for scope account/both; empty = BACKUP_ACCOUNT variable)"
        type: string
        default: ""
      encrypt:
        description: "Archive encryption. none uploads a PLAINTEXT archive (private repositories only)"
        type: choice
        default: gpg
        options: [gpg, 7z, none]
      include_git:
        description: "Also include bare repositories and wikis (full git history)"
        type: boolean
        default: false
      include_source:
        description: "Also include plain (non-bare) source checkouts (implies include_git)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 4 * * 1" # Weekly, Monday 04:00 UTC

permissions: {}

concurrency:
  # Never run two backups of the same org at once - github-backup isn't
  # designed for concurrent runs against one organization.
  group: backup-org
  cancel-in-progress: false

jobs:
  backup:
    # Named so the run page shows what the job does instead of the bare id.
    name: Back up organization / account
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      SCOPE: ${{ inputs.scope || 'org' }}
      # The script backs up whichever of ORG / ACCOUNT is non-empty, and both
      # when both are. ORG is empty for scope=account, ACCOUNT for scope=org.
      ORG: ${{ (inputs.scope != 'account' && (vars.BACKUP_ORG || 'vortaforge')) || '' }}
      ACCOUNT: ${{ ((inputs.scope == 'account' || inputs.scope == 'both') && (inputs.account || vars.BACKUP_ACCOUNT)) || '' }}
      ENCRYPT: ${{ inputs.encrypt || 'gpg' }}
      INCLUDE_GIT: ${{ (inputs.include_git && '1') || '0' }}
      INCLUDE_SOURCE: ${{ (inputs.include_source && '1') || '0' }}
      JOBS: "2" # matches the standard ubuntu-latest runner's 2 vCPUs
      KEEP: "1" # the runner is thrown away after the run; no history to prune
      # The script refuses ENCRYPT=none when this is set, UNLESS
      # ALLOW_PLAINTEXT_UPLOAD is also set. The artifact below is downloadable
      # for 14 days, so an unencrypted archive here exposes private issues,
      # member lists and security alerts (and repository contents with
      # include_git) to everyone who can read this repository.
      UPLOAD_ARCHIVE: "1"
      # Only ever true when `none` was picked explicitly in the dispatch form,
      # so a scheduled run or a stray ENCRYPT value cannot publish plaintext.
      ALLOW_PLAINTEXT_UPLOAD: ${{ (inputs.encrypt == 'none' && '1') || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      # The `runner` context (runner.temp) isn't available in a job-level
      # `env:` block, only in steps - so OUT_DIR/BACKUP_DIR are derived here
      # from $RUNNER_TEMP (the equivalent shell env var) and exported via
      # $GITHUB_ENV for every later step to see. With both targets the script
      # puts each one in its own subfolder of BACKUP_DIR.
      - name: Set work directories
        run: |
          set -euo pipefail
          echo "OUT_DIR=$RUNNER_TEMP/backup-out" >> "$GITHUB_ENV"
          echo "BACKUP_DIR=$RUNNER_TEMP/backup-work" >> "$GITHUB_ENV"
          label="${ORG:-$ACCOUNT}"
          if [ -n "$ORG" ] && [ -n "$ACCOUNT" ]; then label="$ORG-$ACCOUNT"; fi
          echo "ARTIFACT_NAME=${label}-backup-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Check required secrets
        run: |
          set -euo pipefail
          # Without this, scope=both with an empty account would quietly back
          # up the organization only.
          if { [ "$SCOPE" = account ] || [ "$SCOPE" = both ]; } && [ -z "$ACCOUNT" ]; then
            echo "::error::scope=$SCOPE needs an account: fill the 'account' input or set the BACKUP_ACCOUNT repository variable."
            exit 1
          fi
          if [ -n "$ORG" ] && [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ORG_READ_TOKEN secret is missing or empty."
            exit 1
          fi
          if [ -n "$ACCOUNT" ] && [ -z "${ACCOUNT_TOKEN:-}${GH_TOKEN:-}" ]; then
            echo "::error::the account target needs the ACCOUNT_READ_TOKEN secret (or ORG_READ_TOKEN as a fallback)."
            exit 1
          fi
          if [ "$ENCRYPT" != none ] && [ -z "${ARCHIVE_PASSWORD:-}" ]; then
            echo "::error::encrypt=$ENCRYPT needs the BACKUP_ARCHIVE_PASSWORD secret set."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.ACCOUNT_READ_TOKEN }}
          ARCHIVE_PASSWORD: ${{ secrets.BACKUP_ARCHIVE_PASSWORD }}

      # encrypt=none is allowed, but only as a deliberate choice and only where
      # an artifact is not world-readable. On a public repository any signed-in
      # GitHub user can download workflow artifacts, so a plaintext backup of a
      # private organization would be published. If the event carries no
      # repository visibility the value is empty and this step refuses too.
      - name: Plaintext archive safeguard
        if: env.ENCRYPT == 'none'
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "::error::encrypt=none would upload an UNENCRYPTED archive from a repository that is not private (as far as GitHub reports). Use gpg or 7z, or run this workflow from a private repository."
            exit 1
          fi
          echo "::warning::encrypt=none: the archive is uploaded UNENCRYPTED. Everyone with read access to this repository can download it for 14 days."

      # Rehearse first. --dry-run exercises argument parsing, the token
      # pre-flight and every stage's branch selection without writing an
      # archive, so a broken script fails here in seconds instead of forty
      # minutes into a real backup. (Until the 2026-10-08 fixes --dry-run
      # itself aborted on a fresh BACKUP_DIR, so this step would not have
      # been meaningful before.)
      - name: Dry run
        run: bash scripts/ops/backup-org.sh --dry-run --no-source
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.ACCOUNT_READ_TOKEN }}

      - name: Run backup
        run: bash scripts/ops/backup-org.sh
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.ACCOUNT_READ_TOKEN }}
          ARCHIVE_PASSWORD: ${{ secrets.BACKUP_ARCHIVE_PASSWORD }}

      # The checksum file travels INSIDE the artifact, so on its own it only
      # catches corruption, not tampering. Writing the hash to the run's job
      # summary stores it somewhere the artifact's contents cannot change.
      - name: Publish checksum to job summary
        run: |
          set -euo pipefail
          {
            echo "### Backup checksum (SHA-256)"
            echo
            echo '```'
            cat "$OUT_DIR"/*.sha256
            echo '```'
            echo
            echo "Scope: \`$SCOPE\` | Encryption: \`$ENCRYPT\` | Include git: \`$INCLUDE_GIT\` | Include source: \`$INCLUDE_SOURCE\`"
            echo
            if [ "$INCLUDE_GIT" != 1 ] && [ "$INCLUDE_SOURCE" != 1 ]; then
              echo "Metadata-only backup: no git history and no source code."
              echo
            fi
            if [ "$ENCRYPT" = none ]; then
              echo "**This archive is NOT encrypted.**"
              echo
            fi
            # One log per target; count across all of them.
            warns="$(cat "$OUT_DIR"/backup-*.log 2>/dev/null | grep -c 'WARNING:' || true)"
            echo "Warnings during the run: \`${warns:-unknown}\`"
            echo
            echo "A non-zero count means sections were skipped (usually a"
            echo "missing token scope). The archive is still usable, but it is"
            echo "not a complete backup of the organization."
          } >> "$GITHUB_STEP_SUMMARY"
          # Defensive: the script already refuses plaintext under
          # UPLOAD_ARCHIVE=1 without ALLOW_PLAINTEXT_UPLOAD, but a hand-edited
          # run must not be able to upload plaintext without the explicit flag.
          if [ "$ENCRYPT" = none ] && [ "$ALLOW_PLAINTEXT_UPLOAD" != 1 ]; then
            echo "::error::encrypt=none without ALLOW_PLAINTEXT_UPLOAD=1. Refusing to publish plaintext."
            exit 1
          fi

      # Two upload steps instead of one with a wide glob: while encrypt is gpg
      # or 7z, a bare *.tar.gz is not even a candidate for upload.
      - name: Upload archive
        if: env.ENCRYPT != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.OUT_DIR }}/*.tar.gz.gpg
            ${{ env.OUT_DIR }}/*.7z
            ${{ env.OUT_DIR }}/*.sha256
          # Keep for a while on the Actions side too, independent of KEEP
          # (which only prunes files inside a single, ephemeral runner).
          retention-days: 14
          if-no-files-found: error

      - name: Upload archive (UNENCRYPTED)
        if: env.ENCRYPT == 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.OUT_DIR }}/*.tar.gz
            ${{ env.OUT_DIR }}/*.sha256
          retention-days: 14
          if-no-files-found: error
