name: Datapack CI/CD (1.21.8)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-validate-publish:
    name: Build, Validate & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          echo "::group::📦 Installing Dependencies"
          npm install -g spyglass-cli || echo "Spyglass CLI global install failed, falling back to local validation."
          pip install nbtlib jsonlines
          echo "::endgroup::"

      - name: Validate Datapack & References
        run: |
          echo "::group::🔍 1.21.8 Schema & Reference Checks"
          
          # Validate pack.mcmeta existence and pack_format
          python3 -c "
          import json, sys, os
          if not os.path.exists('pack.mcmeta'):
              print('❌ ERROR: pack.mcmeta not found!')
              sys.exit(1)
          
          with open('pack.mcmeta', 'r', encoding='utf-8') as f:
              meta = json.load(f)
              pack_fmt = meta.get('pack', {}).get('pack_format')
              print(f'-> Detected pack_format: {pack_fmt}')
          "
          
          # Run Spyglass linter or fallback to JSON syntax validation
          if command -v spyglass &> /dev/null; then
              spyglass check . --version 1.21.8
          else
              echo "⚠️ Spyglass CLI skipped, running basic JSON syntax validation..."
              find data -name "*.json" -exec python3 -m json.tool {} \; > /dev/null
              echo "✅ All JSON files are valid."
          fi
          echo "::endgroup::"

      - name: Package Datapack (.zip)
        run: |
          echo "::group::📦 Creating ZIP Archive"
          
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          OUTPUT_NAME="Datapack-1.21.8-${VERSION_TAG:-dev}.zip"
          
          # Archive required files only, excluding git/IDE metadata
          zip -r "$OUTPUT_NAME" data pack.mcmeta pack.png README.md LICENSE -x "*.git*" "*.github*" "*.vscode*" > /dev/null
          
          echo "ZIP_FILE=$OUTPUT_NAME" >> $GITHUB_ENV
          echo "🎉 Archive created successfully: $OUTPUT_NAME"
          echo "::endgroup::"

      - name: Generate Step Summary
        run: |
          echo "### 📊 Datapack CI/CD Report" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Version** | Minecraft 1.21.8 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Name** | \`${{ env.ZIP_FILE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | Success ✅ |" >> $GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP_FILE }}
          generate_release_notes: true
          draft: false
          prerelease: false
