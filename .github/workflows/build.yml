name: Validate Datapack

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No "cache:" option on purpose: this repo has no lock file.

      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found, creating a minimal one"
            node -e '
              const name = (process.env.GITHUB_REPOSITORY || "datapack").split("/").pop().toLowerCase();
              const pkg = { name, version: "0.0.0", private: true, description: "Pure datapack repository" };
              require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            '
          fi

      - name: Install dependencies (only if any are declared)
        run: |
          if node -e 'const p=require("./package.json"); process.exit((p.dependencies||p.devDependencies)?0:1)'; then
            npm install
          else
            echo "No dependencies declared, skipping install"
          fi

      - name: Validate datapack
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            // Collect every .json and .mcmeta file, skipping tooling folders
            function walk(dir, out = []) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                if ([".git", "node_modules", ".github"].includes(e.name)) continue;
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p, out);
                else if (/\.(json|mcmeta)$/.test(e.name)) out.push(p);
              }
              return out;
            }

            let failed = 0;
            for (const file of walk(".")) {
              if (path.basename(file) === "package.json" || path.basename(file) === "package-lock.json") continue;
              try {
                JSON.parse(fs.readFileSync(file, "utf8"));
              } catch (err) {
                console.error("::error file=" + file + "::" + err.message);
                failed++;
              }
            }

            if (!fs.existsSync("pack.mcmeta")) {
              console.warn("::warning::pack.mcmeta not found in repo root");
            }

            if (failed) process.exit(1);
            console.log("All JSON files are valid");
          '
